name: daily job digest

on:
  schedule:
    # 06:05 IST, weekdays. IST is UTC+5:30, so 06:05 IST == 00:35 UTC.
    # Scheduled at :35 to avoid GitHub's :00 and :30 minute congestion drops.
    - cron: "35 0 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the email, just build the digest artifact"
        type: boolean
        default: false

# Two runs sharing one dedupe store would race. Queue them instead.
concurrency:
  group: jobhunt-daily
  cancel-in-progress: false

permissions:
  contents: read         # nothing is pushed back; the store lives in the cache

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Restore the dedupe store
        # seen.json is what stops you being emailed the same job twice, so it
        # has to survive between runs. It is NOT committed: it is personal, and
        # a seen.json in the repo would mark every job as seen for anyone who
        # clones it. Cache entries are immutable, so the key is unique per run
        # and restore-keys pulls the most recent one forward.
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            seen_outreach.json
          key: jobhunt-seen-${{ github.run_id }}
          restore-keys: |
            jobhunt-seen-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write profile.json
        # profile.json is derived from your resume. If PROFILE_JSON secret is set,
        # it is used (auto-stripping any markdown fences). Otherwise falls back
        # to the repository profile.json.
        env:
          PROFILE_RAW: ${{ secrets.PROFILE_JSON }}
        run: |
          python - << 'EOF'
          import os, json, sys

          raw = os.environ.get("PROFILE_RAW", "").strip()

          if raw:
              # Strip accidental markdown code blocks (e.g. ```json ... ```)
              if raw.startswith("```"):
                  lines = raw.splitlines()
                  if lines and lines[0].startswith("```"):
                      lines = lines[1:]
                  if lines and lines[-1].startswith("```"):
                      lines = lines[:-1]
                  raw = "\n".join(lines).strip()
              try:
                  data = json.loads(raw, strict=False)
                  with open("profile.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, indent=2)
                  print("profile.json updated from secret and parsed OK")
                  sys.exit(0)
              except Exception as e:
                  try:
                      import re
                      cleaned = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', raw)
                      data = json.loads(cleaned, strict=False)
                      with open("profile.json", "w", encoding="utf-8") as f:
                          json.dump(data, f, indent=2)
                      print("profile.json parsed OK after sanitizing control characters")
                      sys.exit(0)
                  except Exception as e2:
                      print(f"::warning::Could not parse PROFILE_JSON secret ({e2})")

          if os.path.exists("profile.json"):
              print("Using profile.json from repository")
              sys.exit(0)

          print("::error::PROFILE_JSON secret is empty and profile.json not found in repository", file=sys.stderr)
          sys.exit(1)
          EOF

      - name: Run the pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          SCREEN_PROVIDER: ${{ vars.SCREEN_PROVIDER }}
          DRAFT_PROVIDER: ${{ vars.DRAFT_PROVIDER }}
          SCREEN_MODEL: ${{ vars.SCREEN_MODEL || 'gemini-3.5-flash-lite' }}
          DRAFT_MODEL: ${{ vars.DRAFT_MODEL || 'gemini-3.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m jobhunt run
          else
            python -m jobhunt run --send
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report the dedupe store
        if: always()
        run: |
          if [ -f seen.json ]; then
            python -c "import json;print(f'tracking {len(json.load(open(\"seen.json\")))} postings')"
          else
            echo "no seen.json — first run, or the cache expired"
          fi
          if [ -f seen_outreach.json ]; then
            python -c "import json;print(f'outreach {len(json.load(open(\"seen_outreach.json\")))} YC jobs')"
          fi
